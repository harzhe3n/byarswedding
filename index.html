    <style>
      /* Painted before the app loads, so there is never a white flash. */
      html { background: #efe2d0; }
      body { margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #fdf9f2, #ead8bf); }
      .boot svg { width: 34px; height: 34px; fill: #b8893f; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(0.85); opacity: 0.55; } 50% { transform: scale(1.08); opacity: 1; } }
    </style>
